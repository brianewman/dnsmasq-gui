# Generated by Keystone LAN Services
# Main configuration file

# Include all files in the configuration directory
conf-dir=/etc/dnsmasq.d

# Use an additional hosts file for custom DNS records
addn-hosts=/etc/dnsmasq.hosts

# Where to store DHCP leases
dhcp-leasefile=/app/data/dnsmasq.leases

# Standard DNS optimizations
domain-needed
bogus-priv
no-poll

# Upstream DNS and caching is managed via the web interface in dnsmasq-advanced.conf


