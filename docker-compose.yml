services:
  # Keystone LAN Services - DNS, DHCP, and NTP Appliance
  keystone:
    build: .
    container_name: keystone
    restart: always
    network_mode: host # REQUIRED for DHCP/DNS/NTP to reach local network
    privileged: true   # REQUIRED for raw socket access (DHCP/NTP clock)
    cap_add:
      - SYS_TIME
    volumes:
      # Data persistence for DNS, DHCP, and NTP
      - ./data:/app/data
      - ./configs:/app/configs
      - ./logs:/var/log/dnsmasq-gui
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NTP_CONFIG_FILE=/app/configs/chrony.conf
